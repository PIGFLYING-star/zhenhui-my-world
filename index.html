<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future World</title>
<style>
html,body{margin:0;height:100%;overflow-x:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#world{height:500vh}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:60px;left:60px;font-size:42px;letter-spacing:2px}
.loader{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:10}
</style>
</head>
<body>

<div class="loader" id="loader">Loading Future World...</div>

<div id="world">
<div class="stage">
<video id="worldVideo" muted playsinline preload="auto">
<source src="assets/video/scene01.mp4" type="video/mp4">
</video>
<div class="overlay" id="title">Future City</div>
</div>
</div>

<script>
window.SCENES=[
{
title:"Future City",
video:"assets/video/scene01.mp4",
image:"assets/images/scene01.webp"
},
{
title:"AI Factory",
video:"assets/video/scene02.mp4",
image:"assets/images/scene02.webp"
},
{
title:"Digital Horizon",
video:"assets/video/finale.mp4",
image:"assets/images/finale.webp"
}
];
</script>

<script src="scrub-engine.js"></script>
</body>
</html>
